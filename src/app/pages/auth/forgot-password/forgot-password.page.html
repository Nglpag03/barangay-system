```
<div class="wrapper">

  <!-- Header -->
  <div class="header">

    <div class="icon-wrap">
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="white"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <!-- Lock icon -->
        <rect
          x="4"
          y="11"
          width="16"
          height="10"
          rx="2"
        />

        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>

    <h1>Forgot Password?</h1>

    <p>Reset your account password</p>

  </div>


  <!-- Card -->
  <div class="card">

    <form
      (ngSubmit)="submit()"
      novalidate
    >

      <!-- Description -->
      <div class="description">

        <p>
          Enter your email address and we'll send you a link to reset your password.
        </p>

      </div>


      <!-- Email -->
      <div class="field">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
        />

      </div>


      <!-- Error -->
      <div
        class="message error"
        *ngIf="errorMessage"
      >

        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle
            cx="12"
            cy="12"
            r="10"
          />

          <line
            x1="12"
            y1="8"
            x2="12"
            y2="12"
          />

          <line
            x1="12"
            y1="16"
            x2="12.01"
            y2="16"
          />
        </svg>

        <span>
          {{ errorMessage }}
        </span>

      </div>


      <!-- Success -->
      <div
        class="message success"
        *ngIf="successMessage"
      >

        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle
            cx="12"
            cy="12"
            r="10"
          />

          <polyline
            points="8 12 11 15 16 9"
          />
        </svg>

        <span>
          {{ successMessage }}
        </span>

      </div>


      <!-- Send Reset Link -->
      <button
        type="submit"
        class="btn-submit"
        [disabled]="loading || !isEmailValid"
      >

        <span
          *ngIf="loading"
          class="spinner"
        ></span>

        <span>
          {{ loading ? 'Sending…' : 'Send Reset Link' }}
        </span>

      </button>


      <!-- Back to Login -->
      <button
        type="button"
        class="btn-back"
        routerLink="/login"
      >

        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line
            x1="19"
            y1="12"
            x2="5"
            y2="12"
          />

          <polyline
            points="12 19 5 12 12 5"
          />
        </svg>

        <span>Back to Login</span>

      </button>

    </form>

  </div>


  <!-- Footer -->
  <p class="footer-note">
    For authorized personnel only
  </p>

</div>
