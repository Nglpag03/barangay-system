<ion-content [fullscreen]="true">

  <div class="login-container">

    <ion-card>

      <ion-card-header>
        <ion-card-title>
          Barangay System
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>

        <ion-item>
          <ion-label position="stacked">
            Email
          </ion-label>

          <ion-input
            type="email"
            [(ngModel)]="email"
            placeholder="Enter your email">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">
            Password
          </ion-label>

          <ion-input
            type="password"
            [(ngModel)]="password"
            placeholder="Enter your password">
          </ion-input>
        </ion-item>

        @if (errorMessage) {
          <ion-text color="danger">
            <p>{{ errorMessage }}</p>
          </ion-text>
        }

        <ion-button
          expand="block"
          (click)="login()"
          [disabled]="loading">

          @if (loading) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Login
          }

        </ion-button>

      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
