<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Barangay System</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- ============================================ -->
  <!-- PWA: Manifest + theme                              -->
  <!-- ============================================ -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#107c41" />

  <!-- ============================================ -->
  <!-- PWA: iOS "Add to Home Screen" support              -->
  <!-- ============================================ -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Barangay" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- ============================================ -->
  <!-- PWA: Icons                                         -->
  <!-- ============================================ -->
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap"
    rel="stylesheet" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
